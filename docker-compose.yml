services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mypm
      POSTGRES_USER: mypm
      POSTGRES_PASSWORD: mypm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypm -d mypm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mypm:mypm@postgres:5432/mypm
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE: "20971520"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ROUTER_ORDER: ${AI_ROUTER_ORDER:-anthropic_api,claude_agent,codex_cli,mock}
      AI_ANALYSIS_ROUTER_ORDER: ${AI_ANALYSIS_ROUTER_ORDER:-anthropic_api,mock}
      AI_ROUTER_QUOTAS: ${AI_ROUTER_QUOTAS:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - source_storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  source_storage:
